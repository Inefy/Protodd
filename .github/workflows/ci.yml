name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/replay_decoder/go.mod
          cache-dependency-path: tools/replay_decoder/go.sum
      - name: Test replay map conversion
        run: go test -C tools/replay_decoder ./...
      - name: Install model test dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Configure
        run: cmake -S . -B build/ci -A x64 -DPROTODD_BUILD_BWAPI_MODULE=OFF -DPROTODD_BUILD_TESTS=ON "-DPython3_EXECUTABLE=$((Get-Command python).Source)"
      - name: Build
        run: cmake --build build/ci --config Release --parallel
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Test ladder analytics and privacy guard
        run: |
          python tools/log_analyzer.py --self-test
          python tests/test_ladder.py
          python tools/ladder.py audit

  tournament-win32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bwapi/bwapi
          ref: 7687da8abc4726f8366401f11ab648d421385793
          path: build/_deps/bwapi-src
          submodules: recursive
      - name: Verify pinned official BWAPI source
        shell: pwsh
        run: |
          $actual = (git -C build/_deps/bwapi-src rev-parse HEAD).Trim()
          if ($actual -ne "7687da8abc4726f8366401f11ab648d421385793") {
            throw "Unexpected BWAPI source revision: $actual"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/replay_decoder/go.mod
          cache-dependency-path: tools/replay_decoder/go.sum
      - name: Install model test dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Build stock BWAPI interface and Protodd Win32 DLL
        shell: pwsh
        run: ./scripts/build-tournament.ps1 -BwapiRoot build/_deps/bwapi-src -Configuration Release
      - name: Verify tournament build manifest
        shell: pwsh
        run: |
          $manifestPath = "build/tournament/Release/Protodd.build-manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.configuration -ne "Release" -or
              $manifest.cmake_platform -ne "Win32" -or
              $manifest.source_commit -notmatch '^[0-9a-f]{40}$' -or
              $manifest.source_snapshot_sha256 -notmatch '^[0-9a-f]{64}$' -or
              $manifest.source_dirty -ne $false -or
              $manifest.source_diff_sha256 -ne "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" -or
              $manifest.cmake_options.build_bwapi_module -ne "ON" -or
              $manifest.cmake_options.tournament_profile -ne "ON" -or
              $manifest.cmake_options.developer_profile -ne "OFF" -or
              $manifest.cmake_options.learned_research_authority -ne "OFF" -or
              $manifest.bwapi_source_commit -ne "7687da8abc4726f8366401f11ab648d421385793" -or
              $manifest.bwapi_source_patch_sha256 -ne "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" -or
              $manifest.pe_machine -ne "x86" -or
              @($manifest.bwapi_exports) -notcontains "gameInit" -or
              @($manifest.bwapi_exports) -notcontains "newAIModule") {
            throw "Tournament build manifest does not match the pinned Release|Win32 shipping profile"
          }
      - name: Build independent native all-in evaluation profile
        shell: pwsh
        run: |
          cmake -S . -B build/ci-allin -G "Visual Studio 17 2022" -A Win32 `
            -DPROTODD_BUILD_TESTS=OFF -DPROTODD_BUILD_BWAPI_MODULE=ON `
            -DPROTODD_ALLIN_LOCAL_EVALUATION=ON `
            -DPROTODD_WHOLE_GAME_CONTROL=OFF -DPROTODD_WHOLE_GAME_HYBRID=OFF `
            "-DBWAPI_ROOT=$env:GITHUB_WORKSPACE/build/_deps/bwapi-src" `
            "-DBWAPI_LIBRARY=$env:GITHUB_WORKSPACE/build/_deps/bwapi-src/bwapi/BWAPILIB/Release/BWAPILIB.lib"
          if ($LASTEXITCODE -ne 0) { throw "All-in profile configure failed" }
          cmake --build build/ci-allin --config Release --target protodd_bwapi --parallel
          if ($LASTEXITCODE -ne 0) { throw "All-in profile build failed" }
      - name: Package the successful build and rebuild its clean source archive
        shell: pwsh
        run: |
          ./scripts/package-tournament.ps1 -OutputPath artifacts/ci-validation-package.zip
          $cleanSource = Join-Path $env:RUNNER_TEMP "Protodd-clean-source"
          Expand-Archive -LiteralPath artifacts/ci-validation-package.zip -DestinationPath $cleanSource
          Push-Location (Join-Path $cleanSource "source")
          try {
            ./scripts/build-tournament.ps1 -BwapiRoot (Join-Path $env:GITHUB_WORKSPACE "build/_deps/bwapi-src") -Configuration Release
          } finally { Pop-Location }
      - name: Retain qualified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: protodd-tournament-win32
          if-no-files-found: error
          path: |
            build/tournament/Release/Protodd.dll
            build/tournament/Release/Protodd.build-manifest.json
            artifacts/ci-validation-package.zip
